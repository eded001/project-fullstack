root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
bin = "tmp/main"
include_ext = ["go"]
exclude_dir = ["tmp", "bin", ".git"]
include_dir = []
exclude_ext = []
exclude_file = []
delay = 300
stop_on_error = true
send_interrupt = false

[log]
time = true

[misc]
clean_on_exit = true
